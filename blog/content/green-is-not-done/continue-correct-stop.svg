<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-labelledby="t">
  <title id="t">After each station the agent stops; a person opens the file it produced and chooses Continue, Correct or Stop</title>
  <style>
    .bg { fill: #faf7f0; }
    .ink { fill: #1e3a2f; }
    .soft { fill: #1e3a2f; opacity: 0.75; }
    .line { stroke: #1e3a2f; }
    .card { fill: #ffffff; stroke: #1e3a2f; stroke-opacity: 0.18; }
    .go { fill: #9cc8a0; }
    .fix { fill: #f5e3a1; }
    .halt { fill: #f6dfcd; }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1b18; }
      .ink, .soft { fill: #efe9dd; }
      .line { stroke: #efe9dd; }
      .card { fill: #24231f; stroke: #efe9dd; }
      .go { fill: #2f4a37; }
      .fix { fill: #3a3320; }
      .halt { fill: #4a3426; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="ink"/>
    </marker>
  </defs>
  <rect class="bg" width="560" height="470" rx="20"/>

  <rect class="card" x="24" y="24" width="236" height="82" rx="14"/>
  <text class="soft" x="142" y="56" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1">THE AGENT</text>
  <text class="ink" x="142" y="86" text-anchor="middle" font-size="20" font-weight="600">finishes a station</text>

  <line class="line" x1="266" y1="65" x2="294" y2="65" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="card" x="300" y="24" width="236" height="82" rx="14"/>
  <text class="soft" x="418" y="56" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1">A PERSON</text>
  <text class="ink" x="418" y="86" text-anchor="middle" font-size="20" font-weight="600">opens the file, reads</text>

  <line class="line" x1="418" y1="112" x2="418" y2="132" stroke-width="3"/>
  <line class="line" x1="44" y1="132" x2="418" y2="132" stroke-width="3"/>
  <line class="line" x1="44" y1="132" x2="44" y2="410" stroke-width="3"/>
  <line class="line" x1="44" y1="190" x2="64" y2="190" stroke-width="3" marker-end="url(#arrow)"/>
  <line class="line" x1="44" y1="300" x2="64" y2="300" stroke-width="3" marker-end="url(#arrow)"/>
  <line class="line" x1="44" y1="410" x2="64" y2="410" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="go" x="70" y="148" width="466" height="84" rx="16"/>
  <text class="ink" x="92" y="198" font-size="24" font-weight="700">Continue</text>
  <text class="ink" x="232" y="182" font-size="19">The file exists,</text>
  <text class="ink" x="232" y="208" font-size="19">I read it, it is right</text>

  <rect class="fix" x="70" y="258" width="466" height="84" rx="16"/>
  <text class="ink" x="92" y="308" font-size="24" font-weight="700">Correct</text>
  <text class="ink" x="232" y="292" font-size="19">Something is missing, or</text>
  <text class="ink" x="232" y="318" font-size="19">nobody made this decision</text>

  <rect class="halt" x="70" y="368" width="466" height="84" rx="16"/>
  <text class="ink" x="92" y="418" font-size="24" font-weight="700">Stop</text>
  <text class="ink" x="232" y="402" font-size="19">A blocker, or a doubt</text>
  <text class="ink" x="232" y="428" font-size="19">about security or rights</text>
</svg>
