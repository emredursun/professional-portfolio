<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t">
  <title id="t">The ten-link trace: earlier deferral, request, conflict, decision with a name, specification, acceptance criterion, task, test, spec quality gate, commit readiness</title>
  <style>
    .bg { fill: #faf7f0; }
    .ink { fill: #1e3a2f; }
    .soft { fill: #1e3a2f; opacity: 0.75; }
    .line { stroke: #1e3a2f; }
    .link { fill: #ffffff; stroke: #1e3a2f; stroke-opacity: 0.2; }
    .human { fill: #f5e3a1; }
    .gate { fill: #9cc8a0; }
    .dot { fill: #1e3a2f; }
    .num { fill: #faf7f0; }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1b18; }
      .ink, .soft { fill: #efe9dd; }
      .line { stroke: #efe9dd; }
      .link { fill: #24231f; stroke: #efe9dd; }
      .human { fill: #3a3320; }
      .gate { fill: #2f4a37; }
      .dot { fill: #efe9dd; }
      .num { fill: #1c1b18; }
    }
  </style>
  <rect class="bg" width="560" height="500" rx="20"/>

  <path class="line" d="M146 46 V398 Q146 422 170 422 H270 Q294 422 294 398 V46" fill="none" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>

  <g font-size="20" font-weight="600">
    <rect class="link" x="24" y="24" width="244" height="56" rx="14"/>
    <circle class="dot" cx="54" cy="52" r="16"/><text class="num" x="54" y="58" text-anchor="middle" font-size="17" font-weight="700">1</text>
    <text class="ink" x="82" y="59">Earlier deferral</text>

    <rect class="link" x="24" y="96" width="244" height="56" rx="14"/>
    <circle class="dot" cx="54" cy="124" r="16"/><text class="num" x="54" y="130" text-anchor="middle" font-size="17" font-weight="700">2</text>
    <text class="ink" x="82" y="131">Request</text>

    <rect class="link" x="24" y="168" width="244" height="56" rx="14"/>
    <circle class="dot" cx="54" cy="196" r="16"/><text class="num" x="54" y="202" text-anchor="middle" font-size="17" font-weight="700">3</text>
    <text class="ink" x="82" y="203">Conflict</text>

    <rect class="human" x="24" y="240" width="244" height="56" rx="14"/>
    <circle class="dot" cx="54" cy="268" r="16"/><text class="num" x="54" y="274" text-anchor="middle" font-size="17" font-weight="700">4</text>
    <text class="ink" x="82" y="275">Decision + a name</text>

    <rect class="link" x="24" y="312" width="244" height="56" rx="14"/>
    <circle class="dot" cx="54" cy="340" r="16"/><text class="num" x="54" y="346" text-anchor="middle" font-size="17" font-weight="700">5</text>
    <text class="ink" x="82" y="347">Specification</text>

    <rect class="link" x="292" y="312" width="244" height="56" rx="14"/>
    <circle class="dot" cx="322" cy="340" r="16"/><text class="num" x="322" y="346" text-anchor="middle" font-size="17" font-weight="700">6</text>
    <text class="ink" x="350" y="346" font-size="18">Acceptance criterion</text>

    <rect class="link" x="292" y="240" width="244" height="56" rx="14"/>
    <circle class="dot" cx="322" cy="268" r="16"/><text class="num" x="322" y="274" text-anchor="middle" font-size="17" font-weight="700">7</text>
    <text class="ink" x="350" y="275">Task</text>

    <rect class="link" x="292" y="168" width="244" height="56" rx="14"/>
    <circle class="dot" cx="322" cy="196" r="16"/><text class="num" x="322" y="202" text-anchor="middle" font-size="17" font-weight="700">8</text>
    <text class="ink" x="350" y="203">Test</text>

    <rect class="gate" x="292" y="96" width="244" height="56" rx="14"/>
    <circle class="dot" cx="322" cy="124" r="16"/><text class="num" x="322" y="130" text-anchor="middle" font-size="17" font-weight="700">9</text>
    <text class="ink" x="350" y="131">Spec quality gate</text>

    <rect class="gate" x="292" y="24" width="244" height="56" rx="14"/>
    <circle class="dot" cx="322" cy="52" r="16"/><text class="num" x="322" y="58" text-anchor="middle" font-size="15" font-weight="700">10</text>
    <text class="ink" x="350" y="59">Commit readiness</text>
  </g>

  <text class="soft" x="280" y="460" text-anchor="middle" font-size="18">Each link is a file you can open.</text>
  <text class="soft" x="280" y="484" text-anchor="middle" font-size="18">A missing one is written down as MISSING.</text>
</svg>
