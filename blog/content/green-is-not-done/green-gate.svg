<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t">
  <title id="t">249 green tests reach the quality check, which finds no test asserting the new data contract and asks for 11 contract tests before work continues</title>
  <style>
    .bg { fill: #faf7f0; }
    .ink { fill: #1e3a2f; }
    .soft { fill: #1e3a2f; opacity: 0.75; }
    .line { stroke: #1e3a2f; }
    .green { fill: #9cc8a0; }
    .gate { fill: #f5e3a1; }
    .warn { fill: #f6dfcd; }
    .sage { fill: #dfe7d8; }
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1b18; }
      .ink, .soft { fill: #efe9dd; }
      .line { stroke: #efe9dd; }
      .green { fill: #2f4a37; }
      .gate { fill: #3a3320; }
      .warn { fill: #4a3426; }
      .sage { fill: #27322b; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="ink"/>
    </marker>
  </defs>
  <rect class="bg" width="560" height="400" rx="20"/>

  <rect class="green" x="24" y="28" width="160" height="150" rx="16"/>
  <text class="ink" x="104" y="96" text-anchor="middle" font-size="46" font-weight="700">249</text>
  <text class="ink" x="104" y="130" text-anchor="middle" font-size="19">existing tests</text>
  <text class="soft" x="104" y="158" text-anchor="middle" font-size="18">all green</text>

  <line class="line" x1="190" y1="103" x2="216" y2="103" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="gate" x="222" y="16" width="174" height="174" rx="16"/>
  <text class="soft" x="309" y="48" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="1">QUALITY CHECK</text>
  <text class="ink" x="309" y="80" text-anchor="middle" font-size="19" font-weight="600">Which test</text>
  <text class="ink" x="309" y="104" text-anchor="middle" font-size="19" font-weight="600">asserts the new</text>
  <text class="ink" x="309" y="128" text-anchor="middle" font-size="19" font-weight="600">data contract?</text>
  <rect class="warn" x="259" y="142" width="100" height="34" rx="17"/>
  <text class="ink" x="309" y="166" text-anchor="middle" font-size="19" font-weight="700">none</text>

  <line class="line" x1="402" y1="103" x2="428" y2="103" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="sage" x="434" y="28" width="110" height="150" rx="16"/>
  <text class="ink" x="489" y="96" text-anchor="middle" font-size="40" font-weight="700">+11</text>
  <text class="ink" x="489" y="130" text-anchor="middle" font-size="19">contract</text>
  <text class="ink" x="489" y="154" text-anchor="middle" font-size="19">tests</text>

  <rect class="sage" x="24" y="226" width="512" height="148" rx="16"/>
  <text class="ink" x="280" y="272" text-anchor="middle" font-size="22" font-weight="700">Green said nothing had failed.</text>
  <text class="ink" x="280" y="306" text-anchor="middle" font-size="22" font-weight="700">The check asked what had been tested.</text>
  <text class="soft" x="280" y="346" text-anchor="middle" font-size="18">Only then: continue.</text>
</svg>
