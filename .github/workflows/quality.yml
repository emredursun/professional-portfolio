# Quality gates shared by preview.yml (pull requests) and deploy.yml (main).
# Nothing deploys unless every step here passes.
name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The JSON copy feeds the /quality page (scripts/write-quality.js).
      - name: Dependency audit (runtime)
        run: |
          mkdir -p reports
          npm audit --omit=dev --json > reports/audit.json || true
          npm audit --omit=dev --audit-level=moderate

      - name: Typecheck (strict)
        run: npm run typecheck

      # typescript-eslint, react-hooks (incl. the React Compiler rules) and
      # jsx-a11y; warnings fail the build too.
      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: No unused files, exports or dependencies
        run: npm run knip

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # prebuild regenerates the sitemap and the GitHub profile README from
      # portfolio data. If either differs from the commit, someone changed
      # content without committing the regenerated files.
      - name: Generated files are committed
        run: git diff --exit-code -- public/sitemap.xml scripts/sitemap-state.json profile/README.md

      # The blog build must give the same bytes run to run on the real build
      # (docs/adr/0001-static-blog-build.md). Clock independence is unit-tested
      # (tests/blog/build.test.ts builds under two fake clocks).
      - name: Blog build is deterministic
        run: |
          set -euo pipefail
          snapshot() { (cd dist && find blog blog.html assets -type f \( -path 'blog/*' -o -name 'blog.html' -o -name 'blog-*' \) -print0 | sort -z | xargs -0 sha256sum); }
          before="$(snapshot)"
          node scripts/build-blog.js > /dev/null
          after="$(snapshot)"
          [ "$before" = "$after" ] || { diff <(echo "$before") <(echo "$after") || true; echo "::error::Rebuilding the blog changed its output"; exit 1; }

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Renders dist/cv/Emre-Dursun-CV-<lang>.pdf from the built print layout.
      # Before the e2e step, which checks the files, and before the dist
      # upload that deploy.yml ships.
      - name: Generate CV PDFs
        run: npm run generate:cv

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      # Mobile first: every LHCI collect clears .lighthouseci, so the desktop
      # run below leaves only desktop results there for the quality report.
      # The mobile reports are kept in .lighthouseci-mobile.
      # The portfolio pages come from the lighthouserc file, the blog pages
      # from what the build wrote (scripts/lighthouse-urls.js), so real posts
      # can replace the samples without a CI change.
      - name: Lighthouse budgets (mobile)
        # A plain assignment, so a failing script stops the step (inside the
        # command's arguments its failure would be ignored).
        run: |
          set -euo pipefail
          urls="$(node scripts/lighthouse-urls.js lighthouserc.mobile.json)"
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json $urls

      - name: Lighthouse budgets (desktop)
        # A plain assignment, so a failing script stops the step (inside the
        # command's arguments its failure would be ignored).
        run: |
          set -euo pipefail
          urls="$(node scripts/lighthouse-urls.js lighthouserc.json)"
          npx --yes @lhci/cli@0.15.1 autorun $urls

      # dist/quality.json for the /quality page, from this run's reports.
      # After every gate, so it can only describe a run that passed them.
      - name: Quality report
        run: node scripts/write-quality.js

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            playwright-report
            coverage
            .lighthouseci
            .lighthouseci-mobile
            reports
          # .lighthouseci* are hidden folders, which upload-artifact skips by
          # default: the Lighthouse reports were never uploaded.
          include-hidden-files: true
          retention-days: 14
