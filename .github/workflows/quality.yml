# Quality gates shared by preview.yml (pull requests) and deploy.yml (main).
# Nothing deploys unless every gate here passes.
#
# Job graph (jobs run in parallel wherever they can):
#
#   checks ──────────────────────────────────┐
#   build ─┬─ e2e ──────────────────────────┤
#          ├─ lighthouse-desktop ───────────┼─ report ─ verify
#          └─ lighthouse-mobile ────────────┘
#
# `verify` keeps the name branch protection requires
# ("quality / Typecheck, test, build, e2e, Lighthouse"): it is green only when
# every other job is green, so no gate is weaker than the single job it replaces.
name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Fast static gates and unit tests. No build needed.
  checks:
    name: Checks (types, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The JSON copy feeds the /quality page (scripts/write-quality.js).
      - name: Dependency audit (runtime)
        run: |
          mkdir -p reports
          npm audit --omit=dev --json > reports/audit.json || true
          npm audit --omit=dev --audit-level=moderate

      - name: Typecheck (strict)
        run: npm run typecheck

      # typescript-eslint, react-hooks (incl. the React Compiler rules) and
      # jsx-a11y; warnings fail the build too.
      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: No unused files, exports or dependencies
        run: npm run knip

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports-checks
          path: |
            coverage
            reports
          retention-days: 14

  # Builds once; e2e and both Lighthouse jobs test exactly these bytes.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # postbuild renders every page in Chromium to put its content in the
      # HTML (scripts/prerender-content.js), and generate:cv needs it too.
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'

      - name: Build
        run: npm run build

      # prebuild regenerates the sitemap and the GitHub profile README from
      # portfolio data. If either differs from the commit, someone changed
      # content without committing the regenerated files.
      - name: Generated files are committed
        run: git diff --exit-code -- public/sitemap.xml scripts/sitemap-state.json profile/README.md

      # The blog build must give the same bytes run to run on the real build
      # (docs/adr/0001-static-blog-build.md). Clock independence is unit-tested
      # (tests/blog/build.test.ts builds under two fake clocks).
      - name: Blog build is deterministic
        run: |
          set -euo pipefail
          # Every language's blog files (blog, tr/blog, nl/blog) and its assets.
          snapshot() { (cd dist && find . -type f \( -path './blog/*' -o -path './blog.html' -o -path './tr/blog.html' -o -path './tr/blog/*' -o -path './nl/blog.html' -o -path './nl/blog/*' -o -path './assets/blog-*' \) -print0 | sort -z | xargs -0 sha256sum); }
          before="$(snapshot)"
          node scripts/build-blog.js > /dev/null
          after="$(snapshot)"
          [ "$before" = "$after" ] || { diff <(echo "$before") <(echo "$after") || true; echo "::error::Rebuilding the blog changed its output"; exit 1; }

      # Renders dist/cv/Emre-Dursun-CV-<lang>.pdf from the built print layout.
      # Before the upload: e2e checks the files and deploy.yml ships them.
      - name: Generate CV PDFs
        run: npm run generate:cv

      # Named build-dist, not dist: the `report` job publishes the final `dist`
      # (this build plus quality.json) that the deploy jobs download.
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: build-dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'

      - uses: actions/download-artifact@v7
        with:
          name: build-dist
          path: dist

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports-e2e
          path: |
            playwright-report
            reports
          retention-days: 14

  # The portfolio pages come from the lighthouserc file, the blog pages from
  # what the build wrote (scripts/lighthouse-urls.js), so real posts can replace
  # the samples without a CI change. Budgets and assertions are identical for
  # every run; only the number of runs per URL differs: 3 on pull requests for
  # speed, 5 on main (deploy) where the medians gate a release.
  lighthouse-desktop:
    name: Lighthouse budgets (desktop)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v7
        with:
          name: build-dist
          path: dist

      # System fonts and libraries only (no browser download), so the Lighthouse
      # environment, and its CLS/LCP baselines, match the old single job.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Lighthouse budgets (desktop)
        env:
          # github.event_name is the caller's event inside a reusable workflow.
          RUNS: ${{ github.event_name == 'pull_request' && '3' || '5' }}
        # A plain assignment, so a failing script stops the step (inside the
        # command's arguments its failure would be ignored).
        run: |
          set -euo pipefail
          urls="$(node scripts/lighthouse-urls.js lighthouserc.json)"
          npx --yes @lhci/cli@0.15.1 autorun --collect.numberOfRuns="$RUNS" $urls

      # The desktop reports feed the /quality page (scripts/write-quality.js).
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-desktop
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14

  lighthouse-mobile:
    name: Lighthouse budgets (mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v7
        with:
          name: build-dist
          path: dist

      # System fonts and libraries only (no browser download), so the Lighthouse
      # environment, and its CLS/LCP baselines, match the old single job.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Lighthouse budgets (mobile)
        env:
          RUNS: ${{ github.event_name == 'pull_request' && '3' || '5' }}
        run: |
          set -euo pipefail
          urls="$(node scripts/lighthouse-urls.js lighthouserc.mobile.json)"
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json --collect.numberOfRuns="$RUNS" $urls

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-mobile
          path: .lighthouseci-mobile
          include-hidden-files: true
          retention-days: 14

  # Adds dist/quality.json for the /quality page, from this run's reports, and
  # publishes the `dist` artifact the deploy jobs download. After every gate
  # (needs), so it can only describe a run that passed them.
  report:
    name: Quality report
    needs: [checks, build, e2e, lighthouse-desktop, lighthouse-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v7
        with:
          name: build-dist
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: reports-checks
      - uses: actions/download-artifact@v7
        with:
          name: reports-e2e
      - uses: actions/download-artifact@v7
        with:
          name: lighthouse-desktop
          path: .lighthouseci

      - name: Quality report
        run: node scripts/write-quality.js

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 7

  # The one check branch protection requires. A skipped job counts as passing
  # for a required check, so this runs always() and fails unless every job
  # (report included) succeeded. Same name as the old single job.
  verify:
    name: Typecheck, test, build, e2e, Lighthouse
    needs: [checks, build, e2e, lighthouse-desktop, lighthouse-mobile, report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every quality job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::A quality job did not succeed"; exit 1; }
          done
