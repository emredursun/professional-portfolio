# main: run every quality gate, then deploy the exact build that passed them
# to the live channel. Replaces firebase-deploy.yml and
# firebase-hosting-merge.yml, which both deployed on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; let an in-flight one finish.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to emredursun.nl
    needs: quality
    runs-on: ubuntu-latest
    # Add a required reviewer under Settings -> Environments -> production to
    # make every release wait for an explicit approval (see docs/RUNBOOK.md).
    environment:
      name: production
      url: https://emredursun.nl
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMREDURSUN_PORTFOLIO }}
          channelId: live
          projectId: emredursun-portfolio

      - name: Smoke test the release
        run: |
          set -euo pipefail
          expected="$(cat dist/version.json | grep '"commit"' | cut -d'"' -f4)"
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS https://emredursun.nl/version.json | grep '"commit"' | cut -d'"' -f4 || true)"
            [ "$live" = "$expected" ] && break
            echo "Live is ${live:-unreachable}, waiting for $expected ($attempt/6)"; sleep 10
          done
          [ "$live" = "$expected" ] || { echo "::error::Live site does not serve the deployed commit"; exit 1; }
          for path in / /about /resume /projects /contact /nl/about /tr/about /projects/aegisqa /cv/Emre-Dursun-CV-en.pdf /quality.json /llms.txt /resume.json; do
            curl -fsS -o /dev/null "https://emredursun.nl$path"
          done
          # Deep links must get their own prerendered head (link previews).
          curl -fsS https://emredursun.nl/projects/aegisqa | grep -q '<link rel="canonical" href="https://emredursun.nl/projects/aegisqa" />' \
            || { echo "::error::/projects/aegisqa is not served its prerendered head"; exit 1; }
          # The renamed portrait keeps old indexed URLs working.
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://emredursun.nl/images/portfolio-pic-1.jpeg)"
          [ "$status" = "301" ] || { echo "::error::Old portrait URL returned $status, expected 301"; exit 1; }
          # Unknown URLs must be real 404s (404.html), not the app with a 200.
          status="$(curl -sS -o /dev/null -w '%{http_code}' https://emredursun.nl/no-such-page-smoke-test)"
          [ "$status" = "404" ] || { echo "::error::Unknown URL returned $status, expected 404"; exit 1; }
          echo "Live: $live"
