# Pull requests: run every quality gate. A Firebase preview channel is
# published (and its URL commented on the PR) only for a PR labelled
# "preview" - deploying stays an explicit choice, not a side effect of
# opening a PR.
name: Preview

on:
  pull_request:
    # Defaults plus "labeled", so adding the label starts the preview.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy-preview:
    name: Deploy preview channel
    needs: quality
    # Opt-in through the "preview" label. Secrets are not available to pull
    # requests from forks.
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'preview')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: preview
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EMREDURSUN_PORTFOLIO }}
          projectId: emredursun-portfolio

      # e2e and Lighthouse run on `vite preview`; only real Firebase Hosting
      # proves cleanUrls serves each prerendered file and unknown paths get
      # 404.html. Checking the preview channel catches a surprise on the PR,
      # not in production.
      - name: Check hosting behaviour on the preview channel
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          for path in /about /nl /about/tricentis-tosca-automation /tr/projects/aegisqa /quality; do
            html="$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "$base$path")"
            grep -qF "<link rel=\"canonical\" href=\"https://emredursun.nl$path\"" <<<"$html" \
              || [ "$path" = "/nl" ] \
              || { echo "::error::$path is not served its prerendered head"; exit 1; }
          done
          grep -qF '<html lang="nl"' <<<"$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "$base/nl")" || { echo "::error::/nl is not served nl.html"; exit 1; }
          status="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$base/no-such-page-preview-check")"
          [ "$status" = "404" ] || { echo "::error::Unknown URL returned $status, expected 404"; exit 1; }

          # Blog (static pages beside the SPA; docs/adr/0001-static-blog-build.md).
          # /blog must resolve to blog.html even with a blog/ folder next to it.
          code() { curl -sS --max-time 30 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$1"; }
          shopt -s nullglob
          # What to load comes from what the build wrote, per language: its
          # index, one post, one topic page and the Now page when they exist,
          # so the check follows the content (a language or topic may be absent).
          paths=()
          for prefix in "" tr/ nl/; do
            [ -f "dist/${prefix}blog.html" ] || continue
            paths+=("/${prefix}blog")
            for f in "dist/${prefix}blog"/*.html; do
              [ "$(basename "$f")" = now.html ] || { paths+=("/${prefix}blog/$(basename "$f" .html)"); break; }
            done
            for f in "dist/${prefix}blog/topic"/*.html; do paths+=("/${prefix}blog/topic/$(basename "$f" .html)"); break; done
            [ -f "dist/${prefix}blog/now.html" ] && paths+=("/${prefix}blog/now")
          done
          [ ${#paths[@]} -ge 2 ] || { echo "::error::No English blog pages in dist"; exit 1; }
          post="${paths[1]}"
          # Launched builds write the feeds (BLOG_LAUNCHED); until then every
          # page must be noindex and the feeds must not exist.
          launched=false; [ -f dist/blog/feed.xml ] && launched=true
          for path in "${paths[@]}"; do
            html="$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "$base$path")"
            grep -qF "<link rel=\"canonical\" href=\"https://emredursun.nl$path\"" <<<"$html" \
              || { echo "::error::$path is not served its blog page"; exit 1; }
            if [ "$launched" = false ]; then
              grep -qF 'content="noindex, nofollow"' <<<"$html" \
                || { echo "::error::$path is indexable before launch"; exit 1; }
            fi
          done
          for missing in /blog/no-such-post-preview-check /tr/blog/no-such-post-preview-check /nl/blog/no-such-post-preview-check; do
            [ "$(code "$missing")" = "404" ] || { echo "::error::$missing is not a 404"; exit 1; }
          done
          [ "$(code "$post/")" = "301" ] || { echo "::error::$post/ does not redirect"; exit 1; }
          [ "$(code /blog/)" = "301" ] || { echo "::error::/blog/ does not redirect"; exit 1; }
          if [ "$launched" = true ]; then
            # The live checks: feeds as Atom with nosniff, a post indexable.
            bash scripts/check-blog-live.sh "$base"
          else
            # Before launch there is no feed. Firebase applies header rules
            # whatever the status, so this 404 carries the feed's Atom
            # Content-Type; nothing links to it, so only the status matters.
            for feed in /blog/feed.xml /tr/blog/feed.xml /nl/blog/feed.xml; do
              [ "$(code "$feed")" = "404" ] || { echo "::error::$feed exists before launch"; exit 1; }
            done
          fi
